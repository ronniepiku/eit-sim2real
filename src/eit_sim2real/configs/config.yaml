# EIT Touch Classification - Training Configuration
# ==================================================

# Dataset
data:
  path: "data/eit_dataset.mat"
  use_noisy: true
  test_size: 0.15
  val_size: 0.15
  normalize: true
  scaler: "robust"

# Model: cnn1d
cnn:
  channels: [32, 64, 128]
  fc_dim: 128
  dropout: 0.3

# Training (default — used for clean-trained models)
training:
  epochs: 200
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_patience: 10
  scheduler_factor: 0.5
  early_stopping_patience: 40
  label_smoothing: 0.0

# Training overrides for noisy/augmented conditions
# These stronger regularisation settings reduce overfitting to noise statistics
training_noisy:
  weight_decay: 0.001
  dropout: 0.4
  label_smoothing: 0.05

# Training overrides for mixed clean+noisy regime
training_mixed:
  weight_decay: 0.001
  dropout: 0.4
  label_smoothing: 0.05
  clean_ratio: 0.3  # 30% clean, 70% noise-augmented per batch

# Baselines
baselines:
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
  random_forest:
    n_estimators: 500
    max_depth: null
    min_samples_split: 5
  mlp:
    hidden_layers: [128, 128]
    max_iter: 500

# Evaluation
evaluation:
  n_folds: 5
  robustness_noise_levels: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  severity_multipliers: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

# Online noise augmentation (Python-side)
# Used by train.py, run_all_experiments.py, and ablation.py
noise_augmentation:
  enabled: true
  snr_db: 40.0
  noise_floor: 1.0e-4
  contact_impedance_std_percent: 10.0
  max_bias: 0.02
  adc_bits: 16
  voltage_range: 1.0
  n_electrodes: 16
  # Multi-severity: sample severity from this range each batch
  # Prevents the model from memorising one specific noise level
  severity_range: [0.5, 2.0]


architecture_sweep:
  block_counts: [2, 3, 4, 5]
  dev_fraction: 0.1

# Hyperparameter optimisation uaing grid search
hyperparameter_optimisation:
  n_folds: 3
  epochs_per_trial: 100
  final_model_epochs: 150
  final_early_stopping_patience: 30
  objective: "robustness"  # Harmonic mean of clean-F1 and noisy-F1
  search_space:
    channels:
      - [32, 64, 128]
      - [64, 128, 256]
      - [32, 64, 128, 256]
      - [64, 128, 256, 512]
    fc_dim: [128, 256]
    dropout: [0.2, 0.3, 0.5]
    learning_rate: [0.001, 0.0005, 0.0001]
    batch_size: [32, 64, 128]
    weight_decay: [0.0001, 0.001]
    noise_augmentation: [false, true]

# Reproducibility
seed: 42

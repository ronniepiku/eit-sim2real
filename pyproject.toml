[project]
name = "eit-touch-classification"
version = "0.1.0"
description = "Noise-robust classification of simulated touch for EIT-based electronic skin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ronald P" }]
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.12.0",
    "h5py>=3.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["N803", "N806"]  # Allow uppercase in args/vars (ML convention: X for features)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

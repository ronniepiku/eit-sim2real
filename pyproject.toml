[project]
name = "eit-touch-classification"
version = "0.1.0"
description = "Noise-robust classification of simulated touch for EIT-based electronic skin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ronald P" }]
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.2",
    "h5py>=3.8.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "PT"]
ignore = [
    "N803", "N806",  # Allow uppercase in args/vars (ML convention: X for features)
    "E501",  # Line length handled by ruff formatter; remaining are strings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

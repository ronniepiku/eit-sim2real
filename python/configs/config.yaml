# EIT Touch Classification - Training Configuration
# ==================================================

# Dataset
data:
  path: "data/cleaned/eit_cleaned.mat"
  use_noisy: true
  test_size: 0.15
  val_size: 0.15
  normalize: true
  scaler: "robust"  # Evidence-based: RobustScaler outperforms StandardScaler (p<0.001)

# Model: cnn1d
cnn:
  channels: [32, 64, 128]
  fc_dim: 128
  dropout: 0.3

# Training
training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_patience: 10
  scheduler_factor: 0.5
  early_stopping_patience: 20

# Baselines
baselines:
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: "scale"
  random_forest:
    n_estimators: 500
    max_depth: null
    min_samples_split: 5
  mlp:
    hidden_layers: [128, 128]
    max_iter: 500

# Evaluation
evaluation:
  n_folds: 5
  robustness_noise_levels: [0.0, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0]
  severity_multipliers: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0]

# Online noise augmentation (Python-side)
# Used by train.py and ablation.py for on-the-fly noise injection
noise_augmentation:
  enabled: false  # Set true to apply noise during training
  snr_db: 40.0
  noise_floor: 1.0e-4
  contact_impedance_std_percent: 10.0
  max_bias: 0.02
  adc_bits: 16
  voltage_range: 1.0
  n_electrodes: 16
  # Multi-severity: sample severity from this range each batch
  # Set null to use fixed severity of 1.0
  severity_range: [0.5, 2.0]

# Architecture sweep (for methodology validation)
architecture_sweep:
  block_counts: [2, 3, 4, 5]
  dev_fraction: 0.1

# Hyperparameter optimisation (grid search for robustness)
hyperparameter_optimisation:
  n_folds: 3
  epochs_per_trial: 100
  final_model_epochs: 150
  final_early_stopping_patience: 30
  objective: "robustness"  # Harmonic mean of clean-F1 and noisy-F1
  search_space:
    channels:
      - [32, 64, 128]
      - [64, 128, 256]
      - [32, 64, 128, 256]
      - [64, 128, 256, 512]
    fc_dim: [128, 256]
    dropout: [0.2, 0.3, 0.5]
    learning_rate: [0.001, 0.0005, 0.0001]
    batch_size: [32, 64, 128]
    weight_decay: [0.0001, 0.001]
    noise_augmentation: [false, true]

# Reproducibility
seed: 42
